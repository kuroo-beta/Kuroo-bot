# Optional local backend for compose.music.yml. Keep populated secrets in .env.
server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false # Replaced by youtube-source above.
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
plugins:
  youtube:
    enabled: true
    allowSearch: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
logging:
  level:
    root: WARN
    lavalink: INFO
  request:
    enabled: false
